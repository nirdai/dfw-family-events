name: Weekly DFW Events Update

on:
  schedule:
    # 12:00 UTC = 07:00 בטקסס בשעון קיץ (CDT, UTC-5).
    # בחורף (CST, UTC-6) זה יריץ ב-08:00 בבוקר במקום 07:00 — הפרש שעתיים בשנה, לא קריטי לעדכון שבועי.
    - cron: '0 12 * * 1'
  workflow_dispatch: {}   # מאפשר הרצה ידנית מלשונית Actions בגיטהאב

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run weekly update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_portal.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html update_log.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly events auto-update"
            git push
          fi
