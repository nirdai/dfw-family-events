name: Weekly DFW Events Update

on:
  # 25/10/2026: הריצה השבועית האוטומטית מושבתת זמנית. ריצת 19/10 החזירה 28 אירועים
  # לא מאומתים (בלי חיפוש ברשת) ודרסה את האתר המאומת. להפעלה מחדש: להסיר את ה-#
  # משלוש השורות הבאות, אחרי ריצת dry_run מוצלחת מול Gemini (grounding נוסף ב-25/10/2026).
  # schedule:
  #   # 12:00 UTC = 07:00 בטקסס בשעון קיץ (CDT, UTC-5); בחורף 08:00.
  #   - cron: '0 12 * * 1'
  workflow_dispatch:      # הרצה ידנית מלשונית Actions
    inputs:
      dry_run:
        description: 'ריצת בדיקה: מריצים הכל (כולל חיפוש וסינון) אבל לא דורסים את index.html'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 19/10/2026: חלון ה-retry + מודלי הגיבוי ב-update_portal.py יכולים להמתין עד ~15 דקות
    # במקרה הגרוע. 45 דקות מגן מפני ריצה שנתקעת לגמרי (ברירת המחדל של GitHub היא 6 שעות).
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run weekly update script
        id: run_update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: python update_portal.py

      # 28/09/2026: לפני התיקון הזה, כישלון בשלב הקודם (למשל 503 חוזר
      # מ-Gemini לאורך כל חלון ה-retry) גרם ל-GitHub לדלג אוטומטית על
      # השלב הזה — כלומר שורת השגיאה שהסקריפט כן כתב מקומית ל-
      # update_log.txt (דרך log() בתוך except של main()) אף פעם לא
      # הגיעה לריפו. זה גרם לתעלומה אמיתית: ריצה שבועית נכשלה בפועל
      # (Gemini החזיר 503 בכל 4 הניסיונות, על פני כ-2:20 דקות — יותר
      # מסך כל חלון ה-retry), אבל ב-git לא היה שום זכר לזה, לא הצלחה
      # ולא כישלון. `if: always()` מבטיח שהשלב הזה ירוץ גם כשהשלב
      # הקודם נכשל, כך שלפחות רשומת השגיאה תמיד תגיע לריפו — גם אם
      # index.html עצמו לא מתעדכן (וזה בסדר: main() לא כותב index.html
      # חדש אם הריצה נכשלה, ראו תקלה #7 ב-CLAUDE.md).
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html update_log.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            if [ "${{ steps.run_update.outcome }}" = "failure" ]; then
              git commit -m "Weekly auto-update FAILED - see update_log.txt for error"
            else
              git commit -m "Weekly events auto-update"
            fi
            git push
          fi
