<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFW — טיולים קבועים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--g0:#091510;--g2:#0f3320;--g4:#1a7a3e;--g5:#22a352;--g6:#2ecc71;--g7:#52d987;--g8:#85e8a8;--accent:#00ff88;--gold:#ffd700;--warm:#ff8c42;--text:#dff5ea;--text-dim:#7bbf94;--card-bg:rgba(13,36,22,0.92);--card-border:rgba(46,204,113,0.2)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Rubik',sans-serif;background:var(--g0);color:var(--text);min-height:100vh;direction:rtl}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 5%,rgba(34,163,82,.13) 0%,transparent 55%),radial-gradient(ellipse 50% 70% at 85% 85%,rgba(0,255,136,.07) 0%,transparent 55%),repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(46,204,113,.022) 60px,rgba(46,204,113,.022) 61px),repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(46,204,113,.022) 60px,rgba(46,204,113,.022) 61px);pointer-events:none;z-index:0}

  /* HEADER */
  header{position:relative;z-index:10;padding:2.5rem 2rem 1.5rem;text-align:center;border-bottom:1px solid var(--card-border)}
  .back-btn{display:inline-flex;align-items:center;gap:.5rem;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--text-dim);background:rgba(46,204,113,.06);border:1px solid var(--card-border);padding:.35rem .9rem;border-radius:2rem;cursor:pointer;text-decoration:none;margin-bottom:1.2rem;transition:all .2s}
  .back-btn:hover{border-color:var(--g6);color:var(--g6)}
  .header-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);padding:.3rem 1rem;border-radius:2rem;margin-bottom:1rem}
  h1{font-size:clamp(2rem,5vw,3.8rem);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold) 0%,var(--accent) 60%,var(--g8) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.4rem}
  .subtitle{font-size:.95rem;color:var(--text-dim);font-weight:300}

  /* STATS BAR */
  .stats-bar{display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
  .stat-chip{background:rgba(46,204,113,.06);border:1px solid var(--card-border);border-radius:.5rem;padding:.4rem .85rem;display:flex;flex-direction:column;align-items:center;gap:.05rem}
  .stat-num{font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--accent)}
  .stat-lbl{font-size:.58rem;color:var(--text-dim)}
  .stat-chip.visited-chip .stat-num{color:var(--gold)}

  /* NAV */
  nav{position:sticky;top:0;z-index:20;background:rgba(9,21,16,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--card-border)}
  .nav-row{display:flex;justify-content:center;gap:.5rem;padding:.7rem 1rem;flex-wrap:wrap}
  .nav-row.filter-row{padding:.55rem 1rem;border-top:1px solid rgba(255,255,255,.04)}
  .cat-btn{font-family:'Rubik',sans-serif;font-size:.82rem;font-weight:500;padding:.4rem 1rem;border:1px solid var(--card-border);border-radius:2rem;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .22s;white-space:nowrap}
  .cat-btn:hover{border-color:var(--g6);color:var(--g6);background:rgba(46,204,113,.05)}
  .cat-btn.active{background:var(--g6);border-color:var(--g6);color:var(--g0);font-weight:700;box-shadow:0 0 18px rgba(46,204,113,.45)}
  /* visited filter buttons */
  .vis-btn{font-family:'Rubik',sans-serif;font-size:.78rem;font-weight:500;padding:.35rem .9rem;border:1px solid var(--card-border);border-radius:2rem;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .22s;white-space:nowrap}
  .vis-btn:hover{border-color:var(--gold);color:var(--gold)}
  .vis-btn.active-vis{background:rgba(255,215,0,.12);border-color:var(--gold);color:var(--gold);font-weight:700}
  .vis-btn.active-unvis{background:rgba(46,204,113,.1);border-color:var(--g6);color:var(--g6);font-weight:700}

  /* MAIN */
  main{position:relative;z-index:5;max-width:1300px;margin:0 auto;padding:2rem 1.5rem 5rem}
  .section-header{font-size:1.1rem;font-weight:700;color:var(--g6);margin:2.5rem 0 1.2rem;padding-right:.7rem;border-right:3px solid var(--g6);display:flex;align-items:center;gap:.5rem}
  .attractions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.4rem;margin-bottom:2rem}

  /* CARD */
  .attr-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:1rem;overflow:hidden;transition:transform .28s,box-shadow .28s,border-color .28s;position:relative;backdrop-filter:blur(8px)}
  .attr-card:hover{transform:translateY(-5px);box-shadow:0 18px 50px rgba(46,204,113,.18);border-color:rgba(46,204,113,.55)}
  .attr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g5),var(--accent),var(--g5));opacity:0;transition:opacity .28s}
  .attr-card:hover::before{opacity:1}
  /* visited state */
  .attr-card.been-there{border-color:rgba(255,215,0,.45);background:linear-gradient(160deg,rgba(255,215,0,.05) 0%,var(--card-bg) 35%)}
  .attr-card.been-there::before{background:linear-gradient(90deg,var(--gold),#ffe88a,var(--gold));opacity:1}

  .attr-type{padding:.5rem 1rem;font-size:.62rem;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:.4rem}
  .type-zoo     {background:rgba(34,163,82,.15); color:var(--g7)}
  .type-aquarium{background:rgba(0,150,255,.13);  color:#66bbff}
  .type-safari  {background:rgba(255,180,0,.12);  color:#ffcc55}
  .type-nature  {background:rgba(82,217,135,.13); color:var(--accent)}
  .type-culture {background:rgba(200,150,255,.12);color:#ddaaff}
  .type-race    {background:rgba(255,80,0,.13);   color:#ff9966}

  .attr-body{padding:1rem 1.1rem .8rem}
  .attr-name{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.35rem;line-height:1.3}
  .attr-desc{font-size:.8rem;color:var(--text-dim);line-height:1.65;margin-bottom:.9rem}
  .attr-meta{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-bottom:.9rem}
  .meta-item{display:flex;flex-direction:column;gap:.07rem;background:rgba(0,0,0,.22);border-radius:.4rem;padding:.4rem .55rem}
  .meta-label{font-size:.55rem;font-family:'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--g5);opacity:.85}
  .meta-value{font-size:.78rem;font-weight:500;color:var(--text)}
  .meta-item.full{grid-column:1/-1}

  /* FOOTER */
  .attr-footer{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.1rem;border-top:1px solid rgba(46,204,113,.08);background:rgba(0,0,0,.18);gap:.5rem}
  .rating-wrap{display:flex;align-items:center;gap:.45rem;flex:1}
  .rating-dots{display:flex;gap:3px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--g2)}
  .dot.on{background:var(--g6);box-shadow:0 0 5px rgba(46,204,113,.6)}
  .dot.top{background:var(--accent);box-shadow:0 0 7px rgba(0,255,136,.7)}
  .rating-score{font-family:'Space Mono',monospace;font-size:.88rem;font-weight:700;color:var(--accent)}
  .rating-lbl{font-size:.6rem;color:var(--text-dim)}
  .price-badge{font-size:.72rem;font-weight:600;padding:.22rem .6rem;border-radius:1rem;background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.2);color:var(--g7);white-space:nowrap}
  .price-badge.free{background:rgba(255,215,0,.09);border-color:rgba(255,215,0,.28);color:var(--gold)}

  /* BEEN THERE BUTTON */
  .been-btn{display:flex;align-items:center;gap:.35rem;font-family:'Rubik',sans-serif;font-size:.75rem;font-weight:600;padding:.3rem .75rem;border-radius:1.5rem;border:1px solid var(--card-border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all .22s;white-space:nowrap;flex-shrink:0}
  .been-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
  .been-btn.checked{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.25)}
  .been-btn .check-icon{font-size:.9rem;transition:transform .2s}
  .been-btn.checked .check-icon{transform:scale(1.2)}

  .attr-card.hidden{display:none}
  .last-updated{text-align:center;font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text-dim);padding:.75rem;opacity:.6;border-top:1px solid var(--card-border)}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--g0)}::-webkit-scrollbar-thumb{background:var(--g4);border-radius:3px}
</style>
</head>

// ============================================================
// VISITED STATE — stored in localStorage
// ============================================================
const STORAGE_KEY = 'dfw_visited_v1';

function loadVisited() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e) { return new Set(); }
}

function saveVisited(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e) {}
}

let visited = loadVisited();

function toggleVisited(id, btn, card) {
  if (visited.has(id)) {
    visited.delete(id);
    btn.classList.remove('checked');
    btn.innerHTML = '<span class="check-icon">&#x2B55;</span> לא היינו';
    card.classList.remove('been-there');
  } else {
    visited.add(id);
    btn.classList.add('checked');
    btn.innerHTML = '<span class="check-icon">&#x2714;</span> היינו!';
    card.classList.add('been-there');
  }
  saveVisited(visited);
  updateStats();
  applyVisitFilter();
}

// ============================================================
// BUILD CARD
// ============================================================
function buildCard(a) {
  const isFree = a.price.includes('חינם');
  const isVis = visited.has(a.id);
  let dots = '';
  for(let i=1;i<=10;i++) dots += '<div class="dot '+(i<=a.rating?(a.rating>=9?'top':'on'):'')+'"></div>';

  return '<div class="attr-card'+(isVis?' been-there':'')+'" data-type="'+a.type+'" data-id="'+a.id+'">'
    +'<div class="attr-type type-'+a.type+'">'+a.tl+'</div>'
    +'<div class="attr-body">'
    +'<div class="attr-name">'+a.name+'</div>'
    +'<div class="attr-desc">'+a.desc+'</div>'
    +'<div class="attr-meta">'
    +'<div class="meta-item"><span class="meta-label">&#x1F4CD; מרחק</span><span class="meta-value">'+a.dist+'</span></div>'
    +'<div class="meta-item"><span class="meta-label">&#x1F697; נסיעה</span><span class="meta-value">'+a.drive+'</span></div>'
    +'<div class="meta-item"><span class="meta-label">&#x23F0; שעות</span><span class="meta-value">'+a.hours+'</span></div>'
    +'<div class="meta-item"><span class="meta-label">&#x1F4B0; מחיר</span><span class="meta-value">'+a.price+'</span></div>'
    +'<div class="meta-item full"><span class="meta-label">&#x1F4CD; כתובת</span><span class="meta-value">'+a.address+'</span></div>'
    +'<div class="meta-item full" style="background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.15)">'
    +'<span class="meta-label" style="color:var(--gold)">&#x1F4A1; טיפ</span>'
    +'<span class="meta-value" style="color:#ffe88a">'+a.tip+'</span></div>'
    +'</div></div>'
    +'<div class="attr-footer">'
    +'<div class="rating-wrap"><div><div class="rating-dots">'+dots+'</div><div class="rating-lbl">דירוג קהילתי</div></div>'
    +'<div class="rating-score">'+a.rating+'/10</div></div>'
    +'<span class="price-badge'+(isFree?' free':'')+'">'+a.price.split('/')[0].trim()+'</span>'
    +'<button class="been-btn'+(isVis?' checked':'')+'" onclick="toggleVisited('+a.id+',this,this.closest(\'.attr-card\'))">'
    +'<span class="check-icon">'+(isVis?'&#x2714;':'&#x2B55;')+'</span>'
    +(isVis?' היינו!':' לא היינו')
    +'</button>'
    +'</div></div>';
}

// ============================================================
// FILTER LOGIC
// ============================================================
let curCat = 'all';
let curVisit = 'all';

function filterCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curCat = cat;
  applyFilters();
}

function filterVisit(mode, btn) {
  document.querySelectorAll('.vis-btn').forEach(b => {
    b.classList.remove('active-vis','active-unvis');
  });
  if (curVisit === mode) {
    curVisit = 'all';
    document.getElementById('btnAll').classList.add('active-vis');
  } else {
    curVisit = mode;
    if (mode === 'visited') btn.classList.add('active-vis');
    else if (mode === 'unvisited') btn.classList.add('active-unvis');
  }
  applyFilters();
}

function applyFilters() {
  document.querySelectorAll('.attr-card').forEach(c => {
    const id = parseInt(c.dataset.id);
    const catOk = curCat === 'all' || c.dataset.type === curCat;
    const visOk = curVisit === 'all'
      || (curVisit === 'visited' && visited.has(id))
      || (curVisit === 'unvisited' && !visited.has(id));
    c.classList.toggle('hidden', !(catOk && visOk));
  });
}

function applyVisitFilter() {
  applyFilters();
}

function updateStats() {
  document.getElementById('sTot').textContent = A.length;
  document.getElementById('sVis').textContent = visited.size;
  document.getElementById('sLeft').textContent = A.length - visited.size;
}

// ============================================================
// INIT
// ============================================================
document.getElementById('grid').innerHTML = A.map(buildCard).join('');
document.getElementById('btnAll').classList.add('active-vis');
updateStats();
</script>
